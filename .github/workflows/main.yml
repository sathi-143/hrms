name: CICD
 
on:

  push:

    branches:

      - main

      - develop

  pull_request:

    branches:

      - main

      - develop
 
jobs:

  test:

    runs-on: ubuntu-latest

    services:

      mariadb:

        image: mariadb:10.5

        env:

          MYSQL_ROOT_PASSWORD: root

        ports:

          - 3306:3306

        options: >-

          --health-cmd="mysqladmin ping --silent"

          --health-interval=10s

          --health-timeout=5s

          --health-retries=5
 
    steps:

      - name: Checkout repository

        uses: actions/checkout@v4
 
      - name: Set up Python

        uses: actions/setup-python@v4

        with:

          python-version: "3.11"
 
      - name: Install bench and requirements

        run: |

          pip install frappe-bench

          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
 
      - name: Wait for MariaDB

        run: |

          until mysqladmin ping -h 127.0.0.1 --silent; do

            echo "Waiting for MariaDB to be ready..."

            sleep 5

          done
 
      - name: Setup site

        run: |

          bench init test-bench --frappe-branch version-15 --skip-redis-config-generation

          cd test-bench

          bench new-site test-site \

            --db-root-password root \

            --admin-password admin \

            --mariadb-root-username root

          bench get-app hrms $GITHUB_WORKSPACE

          bench --site test-site install-app hrms
 
      - name: Run tests

        run: |

          cd test-bench

          bench --site test-site run-tests --app hrms

 
